name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic pydantic-settings pyyaml pymatgen numpy pytest typer rich requests
          pip install ruff mypy

      - name: Lint with ruff
        run: |
          ruff check aiida_gw/ --config pyproject.toml
          ruff format --check aiida_gw/ --config pyproject.toml

      - name: Type-check with mypy
        run: mypy aiida_gw/ --config-file pyproject.toml

      - name: Run tests
        run: python -m pytest tests/ -v
